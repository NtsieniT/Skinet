
<!-- check if we have anything inside the breadcrumb. Async pipe subscribes 
automatically to the observable and unsubscribes -->
<ng-container *ngIf="(breadCrumb$ | async) as breadCrumbs">

<!-- section ng-If checks to see if the breadcrumb is greater than 0 and hide
     it from the home page -->

<section 
    *ngIf="breadCrumbs.length > 0 && breadCrumbs[breadCrumbs.length-1].label !== 'home'" 
    class="py-5" 
    style="margin-top: 105px; background-color: #f5f5f5;">

    <div class="container">
        <div class="row d-flex align-items-center">
            <div class="col-9">
                <h1>{{breadCrumbs.length > 0 && breadCrumbs[breadCrumbs.length-1].label | titlecase}}</h1>
            </div>
            <div class="col-3">
                <xng-breadcrumb></xng-breadcrumb>
            </div>
        </div>
    </div>
</section>>
</ng-container>
